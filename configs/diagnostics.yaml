# Diagnostic harness for the Phase 1 baseline post-mortem. Inference only.
seed: 42
device: cuda
batch_size: 256
num_workers: 0

paths:
  survface: Dataset/QMUL-SurvFace-v1/QMUL-SurvFace
  tinyface: Dataset/tinyface/tinyface
  lfw: data/lfw/lfw_home
  detector: models/detector/det_10g.onnx
  cache: outputs/cache
  out: outputs/diagnostics

recognizers:
  arcface: models/weights/arcface_iresnet100.pth
  adaface: models/weights/adaface_ir101_ms1mv2.ckpt
  magface: models/weights/magface_iresnet100_MS1MV2.pth
  curricularface: models/weights/CurricularFace_Backbone.pth

grid:
  channel: [RGB, BGR]
  norm: [pm1, "01"]
  interp: [bicubic, bilinear, area]
  flip: [false, true]

align:
  lowres_side: 112    # upsample LR crops to this before detection
  det_thresh: 0.3
