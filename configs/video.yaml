# Phase 5 (video foundations): detector size study. Inference only.
# Reproduce on a Colab T4 (see colab/phase5_detector_colab.ipynb) or the lab PC:
#   envs/video/Scripts/python.exe scripts/video_detector_study.py --job all
seed: 42

paths:
  wider: Dataset/WIDER_FACE
  chokepoint: Dataset/ChokePoint
  chokepoint_sample: outputs/video/chokepoint_sample
  gt: outputs/video/gt
  eval_crops: outputs/sr/subset/eval_input        # TinyFace / SurvFace eval subset crops (Phase 3), file names in eval_images.csv
  eval_images: outputs/sr/subset/eval_images.csv
  out: outputs/video/detstudy_v2     # v2: SCRFD with the official WIDER preprocessing (outputs/video/detstudy holds the first, superseded run)

detectors:
  scrfd: models/detector/det_10g.onnx
  retinaface: models/detector/retinaface/Resnet50_Final.pth

# modes: full640 = longest side 640 (SCRFD's published operating point); full1280 = frame upscaled to 1280;
# tiled = 2x2 tiles, 20% overlap, each at 640, merged with NMS 0.4
modes: [full640, full1280, tiled]
detect_thresh: 0.02          # detectors keep everything above this; scoring applies its own threshold
score_thresholds: [0.5, 0.3] # recall / false positives are reported at both
nms: 0.4                     # RetinaFace NMS and the tile-merge NMS
iou: 0.5
# SCRFD in this study follows insightface's WIDER test script (mode 0, scrfd_10g_bnkps.py): grey padding after normalisation, rounded
# resize, NMS 0.45. The crop job and the cross-device check keep the unchanged Phase 1 path (preprocess legacy, NMS 0.4).
scrfd: {preprocess: official, nms: 0.45}

# face-height bins in px (WIDER and ChokePoint recall)
bins: [[0, 10], [10, 16], [16, 24], [24, 32], [32, 64], [64, 1000000]]

crops:                       # TinyFace / SurvFace crops: the Phase 1 padded-crop protocol
  lowres_side: 112
  thresh: 0.3

chokepoint_sample:
  n_frames: 1000
  seed: 42

runtime:                     # median ms per frame at 720p, batch 1
  n_frames: 100
  warmup: 10
  size: [1280, 720]

chunk: 200                   # items per resumable chunk

# Phase 6 detector selection (fixed before the T4 run): highest WIDER recall on the 16-24 and 24-32 px bins at score 0.5,
# among (detector, mode) with median 720p runtime <= max_ms on the T4; ties within tie_recall go to the faster one.
selection: {score: 0.5, bins: ["16-24", "24-32"], max_ms: 100, tie_recall: 0.01}

# ---------------------------------------------------------------- Phase 6: core pipeline (plan: research/Sprint_Notes/Phase6_core_pipeline_plan.md)
# Recognizers and preprocessing are the Phase 1 settings (configs/baseline.yaml); the video path must give the same embedding as the Phase 1 aligned path.
recognizers:
  adaface: models/weights/adaface_ir101_ms1mv2.ckpt
  magface: models/weights/magface_iresnet100_MS1MV2.pth
  curricularface: models/weights/CurricularFace_Backbone.pth
preprocess: {input_size: [112, 112], interp: bilinear, flip: true}
batch_size: 128

pipeline:
  out: outputs/video/pipeline            # <out>/<dataset>/<clip>/ : dets.csv, emb_<recognizer>.npy, done.json (resumable per clip)
  detector_mode: full1280                # Phase 5 choice (official SCRFD preprocessing, NMS 0.45: see the scrfd block above)
  fps: 30
  track_input_floor: 0.1                 # the trackers get detections from this score up: ByteTrack's second association needs the low-score detections
                                         # (the Phase 6 plan said >= 0.5; changed before any run so that ByteTrack is not handicapped)
  embed_floor: 0.5                       # faces with a score from here up are aligned and embedded
  recognizers: [adaface]                 # MagFace and CurricularFace are added for the single-frame baseline rows

tracking:                                # re-ID off, camera-motion compensation off (fixed cameras); parameters are the vendored defaults (src/video/track.py)
  frame_rate: 30
  match_iou: 0.3                         # mapping a track back to its detection
  trackers: [bytetrack, botsort]
